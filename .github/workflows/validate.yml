name: validate

# The promise this repository makes is that its SWQL is checkable against the schema.
# This workflow is what keeps that promise true: it re-validates every sample query and
# every sql block in the docs on each change, and verifies the extracted data is
# internally consistent.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The judgement encoded in the tools: inheritance resolution, both navigation
      # directions, verb-change classification, rename detection, determinism.
      - name: Run toolchain tests
        run: python3 tools/test_tools.py

      # Consistency of the checked-in data: count floors, required core entities, and
      # hand-verified verb signatures. Catches extraction that degraded quietly.
      - name: Check extracted data
        run: python3 tools/check_data.py --version 2026.2

      # Every .swql file plus the SWQL embedded in the PowerShell, Python and shell
      # scripts, all resolved against the real schema.
      - name: Validate sample queries
        run: python3 tools/validate_swql.py scripts/

      # The Grafana plugin's example queries and its shipped dashboard carry the same
      # promise as everything else here: every name in them resolves against the schema.
      - name: Validate the Grafana plugin's queries
        run: python3 tools/validate_swql.py apps/grafana-swis-datasource/src apps/grafana-swis-datasource/dashboards

      - name: Validate SWQL in documentation
        run: python3 tools/validate_swql.py --docs docs

      - name: Check generated reference docs are current
        run: |
          python3 tools/build_reference_docs.py --version 2026.2
          python3 tools/build_unverified_index.py
          if ! git diff --quiet -- docs/reference/; then
            echo "::error::docs/reference/ is out of date. Run 'make docs-reference' and commit the result."
            git diff --stat -- docs/reference/
            exit 1
          fi

      # The build must be reproducible: a rebuild from the same sources has to produce
      # byte-identical output, or "regenerate and commit" produces spurious diffs and
      # nobody can tell a real schema change from noise. Python randomizes string hashing
      # per process, so an unsorted set walk anywhere in the pipeline shows up here.
      - name: Check data generation is deterministic
        env:
          PYTHONHASHSEED: random
        run: |
          python3 tools/build_reference_docs.py --version 2026.2
          python3 tools/build_unverified_index.py
          if ! git diff --quiet -- docs/reference/; then
            echo "::error::regenerating docs/reference/ produced a different result on a second run"
            git diff --stat -- docs/reference/
            exit 1
          fi

      # A page that ships with a TODO in it is a page nobody finished. The generated
      # reference is excluded because entity summaries can legitimately contain the word.
      - name: Check for unfinished markers
        run: |
          if grep -rniE '\b(TODO|FIXME|TBD|XXX)\b' docs scripts *.md \
               --exclude-dir=reference; then
            echo "::error::unfinished marker found; finish the section or remove the marker"
            exit 1
          fi
          echo "no unfinished markers"

      - name: Check scripts parse
        run: |
          python3 -m compileall -q tools scripts/python
          for f in scripts/curl/*.sh; do bash -n "$f"; done

      # Entity names in prose are as easy to get wrong as ones in queries, and nothing
      # else checks them.
      - name: Check entity names in prose exist
        run: python3 tools/check_entity_references.py --version 2026.2 --strict

      # Counts go stale silently: rebuilding for another platform version changes them
      # and nothing about the sentence looks wrong afterwards.
      - name: Check numeric claims against the schema
        run: python3 tools/check_counts.py --version 2026.2

      # Arguments are positional, so a reordered signature in prose becomes a call that
      # returns the wrong answer rather than one that errors.
      - name: Check verb and function signatures in prose
        run: python3 tools/check_signatures.py --version 2026.2

      # A page that shows a command and its output is making a claim that rots like any
      # other. Run the documented invocations and compare.
      - name: Check documented tool output matches reality
        run: python3 tools/check_examples.py

      - name: Check documentation links resolve
        run: python3 tools/check_links.py --orphans --check-anchors

  # The Grafana data source plugin: backend tests against a stub SWIS, then the frontend
  # typecheck, lint and bundle. It runs only when the plugin changes, since it needs two
  # toolchains the documentation gate does not.
  grafana-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/grafana-swis-datasource
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/grafana-swis-datasource/go.mod
          cache-dependency-path: apps/grafana-swis-datasource/go.sum

      - name: Backend vet and tests
        run: |
          go vet ./pkg/...
          go test ./pkg/...

      - name: Backend binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/gpx_swis_linux_amd64 ./pkg

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/grafana-swis-datasource/.nvmrc
          cache: npm
          cache-dependency-path: apps/grafana-swis-datasource/package-lock.json

      - name: Frontend typecheck, lint and build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build

  # The hardened Grafana app under apps/ha_app_grafana: its image builds the
  # SWIS plugin from this repository at a pinned commit, so a change to either
  # is checked by starting the image and proving its gates.
  grafana-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app image
        run: docker build --tag local/app-grafana:${{ github.sha }} apps/ha_app_grafana/grafana

      - name: Start the image and prove its gates
        run: apps/ha_app_grafana/scripts/smoke_test.sh local/app-grafana:${{ github.sha }}

      - name: Lint the app's shell and configuration
        run: |
          pip install pyyaml
          shellcheck --shell=bash --exclude=SC1091 \
            apps/ha_app_grafana/grafana/rootfs/run.sh \
            apps/ha_app_grafana/grafana/rootfs/usr/local/bin/grafana_term_open \
            apps/ha_app_grafana/grafana/rootfs/etc/profile.d/grafana_terminal.sh \
            apps/ha_app_grafana/scripts/smoke_test.sh
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['apps/ha_app_grafana/grafana/config.yaml','apps/ha_app_grafana/repository.yaml','apps/ha_app_grafana/grafana/translations/en.yaml']]; print('yaml ok')"
